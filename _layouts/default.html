<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
</head>
<body>

  <header style="background: #3b405f; color: white; padding: 1rem 0;">
    <div style="width: 95%; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
      <div style="font-weight: bold;">{{ site.title }}</div>
      <nav>
        <a href="{{ "/" | relative_url }}" style="color: white; margin-left: 1rem; text-decoration: none;">Home</a>
        <a href="{{ "/projects/" | relative_url }}" style="color: white; margin-left: 1rem; text-decoration: none;">Projects</a>
        <a href="{{ "/cv/" | relative_url }}" style="color: white; margin-left: 1rem; text-decoration: none;">CV</a>
      </nav>
    </div>
  </header>

  <main style="width: 90%; max-width: 1100px; margin: 2rem auto;">
    {{ content }}
  </main>

  <footer style="background: #3b405f; color: white; text-align: center; padding: 1rem 0; margin-top: 2rem;">
    © 2024 . All rights not reserved.
  </footer>

</body>
</html>
